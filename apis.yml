name: DataSine
description: DataSine was a London-based AI personalization startup, founded in 2015 and backed by
  Techstars, that applied machine learning and behavioral psychology to help marketers tailor content,
  imagery, and copy to audience personality traits. The company was acquired by Shutterstock and folded
  into Shutterstock's AI/creative-intelligence work; its datasine.com domain is now registered to
  Shutterstock, Inc. (MarkMonitor) and HTTP 301-redirects to shutterstock.ai. DataSine no longer
  operates an independent product or a developer/API surface, so this profile is retained as an
  acquired-company record rather than an active provider awaiting API artifacts.
